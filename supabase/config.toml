# Konfigurasi minimal Supabase CLI. Jalankan `supabase start` untuk stack lokal (butuh Docker).
project_id = "avcalc"

[api]
port = 54321
schemas = ["public", "storage"]

[db]
port = 54322
major_version = 15

[studio]
port = 54323

[inbucket]
port = 54324

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
